name: Frontend Demo Deployment

on:
  push:
    branches:
      - Demo
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-demo.yml'
  workflow_dispatch:

concurrency:
  group: skill-matrix-demo-frontend
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  build-and-deploy:
    name: Build, sync, and invalidate frontend
    runs-on: ubuntu-latest
    environment: demo
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      FRONTEND_S3_BUCKET: ${{ vars.FRONTEND_S3_BUCKET }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
      APPLICATION_URL: ${{ vars.APPLICATION_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Angular production bundle
        working-directory: frontend
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.APPLICATION_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync Angular browser assets
        run: aws s3 sync frontend/dist/skill-matrix-ui/browser "s3://$FRONTEND_S3_BUCKET" --delete

      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" --paths '/*'

      - name: Report application URL
        run: echo "Frontend deployed at $APPLICATION_URL"
