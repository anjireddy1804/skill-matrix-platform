name: Backend Demo Deployment

on:
  push:
    branches:
      - Demo
    paths:
      - 'backend/**'
      - '.github/workflows/backend-demo.yml'
  workflow_dispatch:

concurrency:
  group: skill-matrix-demo-backend
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  build-and-deploy:
    name: Build, push, and deploy backend
    runs-on: ubuntu-latest
    environment: demo
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      ECS_SERVICE: ${{ vars.ECS_SERVICE }}
      ECS_TASK_DEFINITION_FAMILY: ${{ vars.ECS_TASK_DEFINITION_FAMILY }}
      ECS_CONTAINER_NAME: ${{ vars.ECS_CONTAINER_NAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Test and package backend
        working-directory: backend
        run: mvn --batch-mode clean verify

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.APPLICATION_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build backend image
        id: image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          image_uri="$REGISTRY/$ECR_REPOSITORY:${GITHUB_SHA}"
          docker build --tag "$image_uri" backend
          echo "image_uri=$image_uri" >> "$GITHUB_OUTPUT"

      - name: Push backend image
        run: |
          if aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids imageTag="$GITHUB_SHA" > /dev/null 2>&1; then
            echo "Image tag $GITHUB_SHA already exists; reusing the immutable image."
          else
            docker push "${{ steps.image.outputs.image_uri }}"
          fi

      - name: Download current ECS task definition
        run: aws ecs describe-task-definition --task-definition "$ECS_TASK_DEFINITION_FAMILY" --query taskDefinition > task-definition.json

      - name: Render new task definition
        id: render-task-definition
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.ECS_CONTAINER_NAME }}
          image: ${{ steps.image.outputs.image_uri }}

      - name: Deploy ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-definition.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Report deployment
        run: echo "Backend image ${GITHUB_SHA} deployed to ECS service $ECS_SERVICE."
