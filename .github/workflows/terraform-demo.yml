name: Terraform Demo

on:
  pull_request:
    branches:
      - Demo
    paths:
      - 'infrastructure/terraform/**'
      - '.github/workflows/terraform-demo.yml'
  push:
    branches:
      - Demo
    paths:
      - 'infrastructure/terraform/**'
      - '.github/workflows/terraform-demo.yml'
  workflow_dispatch:
    inputs:
      apply:
        description: 'Apply the reviewed Demo Terraform plan'
        required: true
        default: false
        type: boolean

concurrency:
  group: skill-matrix-demo-terraform
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  TF_IN_AUTOMATION: true

jobs:
  validate:
    name: Validate Terraform
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: infrastructure/terraform/environments/demo
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8

      - name: Check formatting
        working-directory: .
        run: terraform fmt -check -recursive infrastructure/terraform

      - name: Initialize Terraform without backend
        run: terraform init -backend=false -input=false

      - name: Validate Terraform
        run: terraform validate

  plan:
    name: Plan Terraform
    needs: validate
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: demo
    env:
      TF_VAR_terraform_state_bucket_name: ${{ vars.TF_STATE_BUCKET }}
      TF_VAR_create_ecs_service: ${{ vars.CREATE_ECS_SERVICE || 'false' }}
      TF_VAR_backend_image_tag: ${{ vars.BACKEND_IMAGE_TAG || 'latest' }}
      TF_VAR_cors_allowed_origins: ${{ vars.CORS_ALLOWED_ORIGINS_JSON || '["http://localhost:4200"]' }}
    defaults:
      run:
        working-directory: infrastructure/terraform/environments/demo
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TERRAFORM_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Initialize Terraform
        run: terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="key=skill-matrix/demo/terraform.tfstate" -backend-config="region=${{ vars.AWS_REGION }}" -backend-config="use_lockfile=true"

      - name: Plan Terraform
        run: terraform plan -input=false -no-color

  apply:
    name: Apply reviewed Demo plan
    needs: validate
    if: github.event_name == 'workflow_dispatch' && inputs.apply == true
    runs-on: ubuntu-latest
    environment: demo
    env:
      TF_VAR_terraform_state_bucket_name: ${{ vars.TF_STATE_BUCKET }}
      TF_VAR_create_ecs_service: ${{ vars.CREATE_ECS_SERVICE || 'false' }}
      TF_VAR_backend_image_tag: ${{ vars.BACKEND_IMAGE_TAG || 'latest' }}
      TF_VAR_cors_allowed_origins: ${{ vars.CORS_ALLOWED_ORIGINS_JSON || '["http://localhost:4200"]' }}
    defaults:
      run:
        working-directory: infrastructure/terraform/environments/demo
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TERRAFORM_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Initialize Terraform
        run: terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="key=skill-matrix/demo/terraform.tfstate" -backend-config="region=${{ vars.AWS_REGION }}" -backend-config="use_lockfile=true"

      - name: Apply Terraform
        run: terraform apply -input=false -auto-approve
